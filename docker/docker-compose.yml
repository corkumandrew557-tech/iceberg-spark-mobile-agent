version: '3.8'

services:
  spark-master:
    image: bitnami/spark:3.4.0
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    volumes:
      - spark-warehouse:/opt/spark-warehouse
    networks:
      - iceberg-network

  spark-worker:
    image: bitnami/spark:3.4.0
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    networks:
      - iceberg-network

  minio:
    image: minio/minio:latest
    container_name: minio-server
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-storage:/data
    networks:
      - iceberg-network

  postgres:
    image: postgres:15-alpine
    container_name: iceberg-catalog-db
    environment:
      - POSTGRES_USER=iceberg
      - POSTGRES_PASSWORD=iceberg
      - POSTGRES_DB=iceberg_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iceberg-network

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest-server
    depends_on:
      - postgres
    environment:
      - ICEBERG_REST_CATALOG_BACKEND=sql
      - ICEBERG_REST_SQL_LOCATION=postgresql://iceberg:iceberg@postgres:5432/iceberg_catalog
    ports:
      - "8181:8181"
    networks:
      - iceberg-network

volumes:
  spark-warehouse:
  minio-storage:
  postgres-data:

networks:
  iceberg-network:
    driver: bridge
